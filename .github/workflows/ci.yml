name: CI

on:
  push:
    # Só branches: o push de uma tag v* roda este workflow pelo release.yml.
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools \
            libpulse-dev libpipewire-0.3-dev libspa-0.2-dev libgtest-dev
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLOUDMIXER_WARNINGS_AS_ERRORS=ON
      - name: Compilar
        run: cmake --build build
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Pacote .deb
        run: cd build && cpack -G DEB
      - uses: actions/upload-artifact@v4
        with:
          name: loudmixer-linux-deb
          path: build/*.deb

  linux-sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config g++ \
            qt6-base-dev libpulse-dev libpipewire-0.3-dev libspa-0.2-dev libgtest-dev
      - name: Compilar com ASan + UBSan
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLOUDMIXER_BUILD_APP=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  windows:
    # Mesmo toolchain do desenvolvimento local no VS Code: MSYS2 UCRT64
    # (MinGW-w64 + Qt 6). Ver packaging/windows/README.md.
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-tools
            mingw-w64-ucrt-x86_64-qt6-translations
            mingw-w64-ucrt-x86_64-gtest
            mingw-w64-ucrt-x86_64-nsis
      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLOUDMIXER_WARNINGS_AS_ERRORS=ON
      - name: Compilar
        run: cmake --build build
      - name: Testes
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Instalador NSIS + ZIP
        run: cd build && cpack -G "NSIS;ZIP"
      - name: Instalador leva o APO
        run: |
          for f in loudmixer_apo.dll loudmixer-apo-setup.exe; do
            ls build/_CPack_Packages/win64/NSIS/loudmixer-*-win64/bin/$f
          done
      - uses: actions/upload-artifact@v4
        with:
          name: loudmixer-windows
          path: |
            build/loudmixer-*-win64.exe
            build/loudmixer-*-win64.zip
